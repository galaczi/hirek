<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Hírkereső modern, letisztult és villámgyors változata. Magyarország legnépszerűbb hírforrásainak cikkei egyetlen, gyönyörűen strukturált felületen.">
  <meta name="author" content="Antigravity Dev">
  <meta name="robots" content="index, follow">
  <title>Hírkereső Modern - Utilitárius Hírgyűjtő és Felfedező Portál</title>
  
  <!-- SEO & Social Meta -->
  <meta property="og:title" content="Hírkereső Modern - Utilitárius Hírgyűjtő Portál">
  <meta property="og:description" content="Magyarország legnépszerűbb hírforrásainak cikkei egyetlen, gyönyörűen strukturált, villámgyors felületen.">
  <meta property="og:type" content="website">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- SITE HEADER -->
  <header class="site-header" id="site-header-id">
    <div class="header-content">
      
      <!-- Brand Logo -->
      <div class="logo-section">
        <div class="logo-icon" id="brand-logo-icon">H</div>
        <div class="logo-text" id="brand-logo-text">Hír<span>kereső</span><span class="logo-badge">Pro</span></div>
      </div>
      
      <!-- Quick Search -->
      <div class="search-container" id="search-bar-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="search-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.602 10.602Z" />
        </svg>
        <input type="text" id="search-news" class="search-input" placeholder="Keress a hírek között..." aria-label="Hírek keresése">
      </div>
      
      <!-- Live Indicators & Weather -->
      <div class="header-meta" id="header-meta-info">
        <div class="date-widget" id="date-widget-container">
          <div class="date-today" id="date-today">2026. május 27.</div>
          <div class="nameday" id="nameday-container">Ma <span>Dezső</span> napja van!</div>
        </div>
        
        <div class="live-badge" id="live-indicator-badge" title="Automatikus frissítés bekapcsolva">
          <span class="live-dot"></span>
          <span>LIVE</span>
        </div>
      </div>
      
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="app-container">
    <div class="main-grid">
      
      <!-- LEFT SIDEBAR: CATEGORIES & WIDGETS -->
      <aside class="sidebar-left" id="sidebar-left-section">
        
        <!-- Categories Panel -->
        <nav class="panel" id="categories-panel" aria-label="Kategóriák">
          <h2 class="panel-title" id="cat-title-id">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
            </svg>
            Rovatok
          </h2>
          <ul class="cat-nav-list" id="cat-list">
            <li class="cat-nav-item active"><button data-cat="all" id="cat-btn-all">Összes hír <span class="cat-badge">160</span></button></li>
            <li class="cat-nav-item"><button data-cat="belfold" id="cat-btn-belfold">Belföld <span class="cat-badge">25</span></button></li>
            <li class="cat-nav-item"><button data-cat="kulfold" id="cat-btn-kulfold">Külföld <span class="cat-badge">20</span></button></li>
            <li class="cat-nav-item"><button data-cat="gazdasag" id="cat-btn-gazdasag">Gazdaság <span class="cat-badge">22</span></button></li>
            <li class="cat-nav-item"><button data-cat="tech" id="cat-btn-tech">Tech-Tudomány <span class="cat-badge">20</span></button></li>
            <li class="cat-nav-item"><button data-cat="sport" id="cat-btn-sport">Sport <span class="cat-badge">25</span></button></li>
            <li class="cat-nav-item"><button data-cat="bulvar" id="cat-btn-bulvar">Bulvár <span class="cat-badge">24</span></button></li>
            <li class="cat-nav-item"><button data-cat="eletmod" id="cat-btn-eletmod">Életmód <span class="cat-badge">12</span></button></li>
            <li class="cat-nav-item"><button data-cat="kultura" id="cat-btn-kultura">Kultúra <span class="cat-badge">12</span></button></li>
          </ul>
        </nav>
        
        <!-- Weather Widget -->
        <section class="panel" id="weather-panel">
          <h2 class="panel-title" id="weather-title-id">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5m0 15V21m-9-9h1.5m15 0H21m-1.5-7.071-.707.707M6.343 17.657l-.707.707m12.728 0-.707-.707M6.343 6.343l-.707-.707m12.728 0A9 9 0 0 1 5.636 18.364 9 9 0 0 1 18.364 5.636Z" />
            </svg>
            Időjárás
          </h2>
          <label for="weather-city-select" class="visually-hidden" style="display:none">Válassz várost</label>
          <select id="weather-city-select" class="weather-selector">
            <option value="Budapest">Budapest</option>
            <option value="Debrecen">Debrecen</option>
            <option value="Szeged">Szeged</option>
            <option value="Pécs">Pécs</option>
            <option value="Győr">Győr</option>
          </select>
          <div class="weather-display" id="weather-display-container">
            <div class="weather-temp-box">
              <div id="weather-icon-box">
                <!-- SVG injected by JS -->
              </div>
              <span class="weather-temp" id="weather-temp-val">24°C</span>
            </div>
            <div class="weather-details">
              <div class="weather-desc" id="weather-desc-text">Napos</div>
              <div>Szél: 12 km/h</div>
            </div>
          </div>
        </section>
        
        <!-- Exchange Rates Widget -->
        <section class="panel" id="exchange-panel">
          <h2 class="panel-title" id="exchange-title-id" style="justify-content: space-between; display: flex; align-items: center; width: 100%">
            <span style="display: flex; align-items: center; gap: 8px">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
              </svg>
              Devizaárfolyam
            </span>
            <button onclick="updateExchangeRates()" style="color: var(--text-light); hover: var(--primary)" title="Árfolyamok frissítése" aria-label="Árfolyamok frissítése">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:16px; height:16px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
              </svg>
            </button>
          </h2>
          <div class="currency-list" id="exchange-rates-container">
            <!-- Populated dynamically by JS -->
          </div>
        </section>
        
        <!-- Horoscope Widget -->
        <section class="panel" id="horoscope-panel">
          <h2 class="panel-title" id="horoscope-title-id">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499c.153-.433.748-.433.902 0l2.12 5.961a.5.5 0 0 0 .477.34h6.27c.456 0 .646.574.277.838l-5.074 3.619a.5.5 0 0 0-.178.547l2.12 5.96a.5.5 0 0 1-.77.56l-5.073-3.62a.5.5 0 0 0-.577 0l-5.072 3.62a.5.5 0 0 1-.77-.56l2.12-5.96a.5.5 0 0 0-.178-.547L3.477 10.64c-.37-.264-.18-.838.277-.838h6.27a.5.5 0 0 0 .477-.34l2.12-5.961Z" />
            </svg>
            Napi Horoszkóp
          </h2>
          <label for="horoscope-sign-select" class="visually-hidden" style="display:none">Válassz csillagjegyet</label>
          <select id="horoscope-sign-select" class="horoscope-selector">
            <option value="kos">Kos (03.21 - 04.19)</option>
            <option value="bika">Bika (04.20 - 05.20)</option>
            <option value="ikrek">Ikrek (05.21 - 06.21)</option>
            <option value="rak">Rák (06.22 - 07.22)</option>
            <option value="oroszlan">Oroszlán (07.23 - 08.22)</option>
            <option value="szuz">Szűz (08.23 - 09.22)</option>
            <option value="merleg">Mérleg (09.23 - 10.22)</option>
            <option value="skorpio">Skorpió (10.23 - 11.21)</option>
            <option value="nyilas">Nyilas (11.22 - 12.21)</option>
            <option value="bak">Bak (12.22 - 01.19)</option>
            <option value="vizonto">Vízöntő (01.20 - 02.18)</option>
            <option value="halak">Halak (02.19 - 03.20)</option>
          </select>
          <div class="horoscope-text" id="horoscope-text-box">
            <!-- Populated dynamically by JS -->
          </div>
        </section>
        
      </aside>

      <!-- CENTER COLUMN: NEWS LIST & SEARCH FILTERS -->
      <section class="feed-column" id="main-feed-column" aria-label="Hírfolyam">
        
        <div class="feed-header" id="feed-header-controls">
          <!-- Time Interval Filters -->
          <div class="time-filters" role="group" aria-label="Időbeli szűrés">
            <button class="time-btn active" data-time="all" id="time-btn-all">Összes</button>
            <button class="time-btn" data-time="4h" id="time-btn-4h">4 óra</button>
            <button class="time-btn" data-time="12h" id="time-btn-12h">12 óra</button>
            <button class="time-btn" data-time="24h" id="time-btn-24h">24 óra</button>
          </div>
          
          <!-- Publisher Bar Filters -->
          <div class="publisher-bar" id="publisher-bar-filters" role="group" aria-label="Források szerinti szűrés">
            <button class="pub-tag" data-pub="index" id="pub-tag-index">index.hu</button>
            <button class="pub-tag" data-pub="telex" id="pub-tag-telex">telex.hu</button>
            <button class="pub-tag" data-pub="24-hu" id="pub-tag-24hu">24.hu</button>
            <button class="pub-tag" data-pub="hvg" id="pub-tag-hvg">hvg.hu</button>
            <button class="pub-tag" data-pub="444" id="pub-tag-444">444.hu</button>
            <button class="pub-tag" data-pub="portfolio" id="pub-tag-portfolio">portfolio.hu</button>
            <button class="pub-tag" data-pub="blikk" id="pub-tag-blikk">blikk.hu</button>
            <button class="pub-tag" data-pub="qubit" id="pub-tag-qubit">qubit.hu</button>
            <button class="pub-tag" data-pub="g7" id="pub-tag-g7">g7.hu</button>
            <button class="pub-tag" data-pub="nepszava" id="pub-tag-nepszava">nepszava.hu</button>
            <button class="pub-tag" data-pub="mandiner" id="pub-tag-mandiner">mandiner.hu</button>
          </div>
        </div>
        
        <!-- Live Articles List -->
        <div class="news-feed-list" id="news-feed-list">
          <!-- Dynamically injected news rows -->
        </div>
        
        <!-- Load More infinite scroll support -->
        <div class="loader-container" id="load-more-btn-container">
          <button class="load-more-btn" onclick="loadMoreNews()" id="load-more-action-btn">További hírek betöltése</button>
        </div>
        
      </section>

      <!-- RIGHT SIDEBAR: TRENDING & SAVED BOOKMARKS -->
      <aside class="sidebar-right" id="sidebar-right-section">
        
        <!-- TOP 24 Articles -->
        <section class="panel" id="trending-panel">
          <h2 class="panel-title" id="trending-title-id">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18 9 11.25l4.306 4.306a11.95 11.95 0 0 1 5.814-5.518l2.74-1.22m0 0-5.94-2.281m5.94 2.28-2.28 5.941" />
            </svg>
            TOP 24 Hírek
          </h2>
          <div class="top-news-list" id="top-news-list-container">
            <!-- Dynamically populated top articles -->
          </div>
        </section>
        
        <!-- Saved Bookmarks panel -->
        <section class="panel" id="bookmarks-panel">
          <h2 class="panel-title" id="bookmarks-title-id">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" />
            </svg>
            Mentett híreid
          </h2>
          <div class="bookmark-list" id="bookmark-list-container">
            <!-- Dynamically populated bookmarks -->
          </div>
        </section>
        
      </aside>
      
    </div>
  </main>

  <!-- PREMIUM ACTION TOAST -->
  <div class="toast" id="toast-alert" role="alert" aria-live="assertive">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="toast-success-icon">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
    </svg>
    <span id="toast-text">Művelet sikeresen elvégezve!</span>
  </div>

  <!-- JavaScript Application Engine -->
  <script src="app.js"></script>
</body>
</html>
